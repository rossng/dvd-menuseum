[workspace]
resolver = "2"
exclude = ["vendor"]
members = ["crates/core", "crates/engine", "crates/lpcm", "crates/media", "crates/cli", "crates/wasm"]

[workspace.package]
edition = "2021"
license = "BlueOak-1.0.0"

# Whole-program optimisation: about 10% off the wasm player's decode time.
[profile.release]
lto = true
codegen-units = 1
