[package]
name = "menuseum-media"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Decodes DVD VOBUs (MPEG-2 video, AC-3/DTS/LPCM/MPEG audio, subpictures) and runs the real-time menu player."

[dependencies]
menuseum-core = { path = "../core" }
menuseum-lpcm = { path = "../lpcm" }
oxideav-core = "0.1"
oxideav-ac3 = "=0.0.11"
oxideav-dts = "=0.0.2"
oxideav-mp2 = "=0.0.10"
oxideav-mpeg12video = { path = "../../vendor/oxideav-mpeg12video" }

# For examples/play.rs only; the library itself depends on the Navigator interface.
[dev-dependencies]
menuseum-engine = { path = "../engine" }
