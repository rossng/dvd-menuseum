name: Pages

# Builds the site (web/, with its bundles) and deploys it to GitHub Pages. In the
# repository settings, set Pages → Source to "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one but never
# interrupts one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      # The bundles are ~460 MB of LFS objects, against a free quota of 1 GB
      # of LFS bandwidth a month, so keep them in the Actions cache and only
      # download when an archive changes.
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-objects
      - name: Restore LFS cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-objects') }}
          restore-keys: lfs-
      - name: Fetch bundles
        run: |
          git lfs pull
          python3 scripts/bundles.py unpack

      - name: Install Rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the site's dependencies
        run: npm ci
        working-directory: web

      - name: Build the wasm player
        run: |
          cargo build --release --locked -p menuseum-wasm --target wasm32-unknown-unknown
          mkdir -p web/pkg
          cp target/wasm32-unknown-unknown/release/menuseum_wasm.wasm web/pkg/

      # The site's base path: /<repository>/ on a project site.
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build the site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          (cd web && npm run build -- --outDir ../_site)
          size=$(du -sm _site | cut -f1)
          echo "Site is ${size} MB"
          # GitHub Pages sites are limited to 1 GB.
          if [ "$size" -gt 950 ]; then echo "::error::the site is ${size} MB, over the Pages limit"; exit 1; fi
          if [ "$size" -gt 800 ]; then echo "::warning::the site is ${size} MB, nearing the 1 GB Pages limit"; fi
      - name: Smoke-test the site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: node scripts/site-smoke.mjs _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
