name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      # Only the smallest bundle, for the wasm smoke test: the LFS bandwidth
      # quota is precious (see pages.yml).
      - name: Fetch the smoke-test bundle
        run: |
          git lfs pull --include fixtures/bundles/av-calibration-ntsc.tar.zst
          python3 scripts/bundles.py unpack av-calibration-ntsc

      # rustup reads the channel and wasm32 target from rust-toolchain.toml.
      - name: Install Rust
        run: rustup show && rustup component add clippy
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      # Reported, not enforced: the tree has a few warnings today.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Build the wasm player
        run: cargo build --release --locked -p menuseum-wasm --target wasm32-unknown-unknown

      - name: Smoke-test the wasm player
        run: |
          node scripts/wasm-smoke.mjs fixtures/bundles/av-calibration-ntsc 20 | tee smoke.log
          grep -q '"frame":' smoke.log || { echo "::error::no video frames decoded"; exit 1; }
          if grep -E '^[0-9.]+s error ' smoke.log; then echo "::error::the player reported errors"; exit 1; fi

      - name: Check the site scripts
        run: python3 -m py_compile scripts/*.py

      - name: Check the player's third-party notices are current
        run: python3 scripts/notices.py --check

      - name: Check the discs' looks are current
        run: python3 scripts/looks.py --check

      # The site with the smoke-test bundle only, in headless Chrome (which
      # the runner image has).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the site
        env:
          DISCS: av-calibration-ntsc
        run: |
          mkdir -p web/pkg
          cp target/wasm32-unknown-unknown/release/menuseum_wasm.wasm web/pkg/
          cd web
          npm ci
          npm run build -- --outDir ../target/site
      - name: Smoke-test the site
        run: node scripts/site-smoke.mjs target/site
